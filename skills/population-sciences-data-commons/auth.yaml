credentials: []
# The Population Sciences Data Commons (PS-DC) GraphQL API is open-access for metadata and search.
# No API key, token, cookie, OAuth flow, or login is required. There is nothing to put in an
# Authorization header; requests are anonymous. Two transport requirements:
#   - Requests must use HTTP POST (a GET is rejected with "API will only accept POST requests").
#   - The POST body must include a `variables` key (even an empty {}), or the server errors with
#     "Cannot invoke java.util.Map.keySet() because variables is null".
#
# IMPORTANT: PS-DC is a NEW, undocumented, best-effort PROTOTYPE. As of verification (~June 2026) the
# deployed API answers STUDY-LEVEL queries only; participant/sample/file-record/node-level queries are
# defined in the schema but error with "Unable to connect to localhost:7687" (Neo4j backend down).
#
# This API returns METADATA ONLY. It does not stream participant data. Study-level files (data
# dictionaries, manifests) from `studyFiles` carry a CRDC DRS id (data_file_uuid / drs_uri like
# `dg.4DFC/<uuid>` → `drs://nci-crdc.datacommons.io/dg.4DFC/<uuid>`) and a `data_file_access_control`
# (e.g. "Open Access"); resolve bytes out-of-band via CRDC DRS. The underlying participant-level data
# for NLST/PLCO/PBCS is distributed through NCBI dbGaP under each study's `dbgap_accession_id`.
description: >-
  No credentials required. The PS-DC GraphQL API is an open-access metadata interface; all queries are
  anonymous (HTTP POST only, and the body must include a `variables` key). It is a prototype that
  currently answers study-level queries only. The API does not download participant data — study files
  carry a CRDC DRS id, and participant data is distributed via dbGaP under each study's accession.
service: "https://populationsciences.datacommons.cancer.gov/"
