version: '3'

networks:
  beaker:

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8889:8888"
    environment:
      - DEBUG=1
      - LOGLEVEL=INFO
      - JUPYTER_SERVER=http://jupyter:8888
      - JUPYTER_TOKEN=89f73481102c46c0bc13b2998f9a4fce
      - PYTHONPATH=/jupyter
      - ENABLE_CHECKPOINTS=true
      - TOOL_ENABLED_ASK_USER=true
      - TOOL_ENABLED_RUN_CODE=true
    env_file:
      - .env
    volumes:
      - ./src/beaker_biomedical:/src/beaker_biomedical
      - ./skills:/jupyter/.beaker/skills
    networks:
      - beaker
