[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beaker-biomedical-test-harness"
version = "0.1.0"
description = "Evaluation harness for the NCI CRDC agent skills (tests/ answer keys, unified LiteLLM engine)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Satchel Baldwin", email = "satchel@jataware.com" },
]
dependencies = [
  # Single model-access abstraction for both the agent and the judge: every
  # provider (Anthropic / OpenAI / Gemini natively, everything else via
  # OpenRouter) is reached through litellm with one OpenAI-style tool-calling loop.
  "litellm>=1.89",
  # eval.md answer keys are YAML-backed (the parser reads each test's checks block).
  "pyyaml>=6.0",
  # Libraries the skills' own example code imports (so a failure reflects the
  # skill, not a missing dependency).
  "requests>=2.31",
  "cdapython>=2.1.0",
  # Build-time markdown -> HTML for the static dashboard's Skills/Tests views
  # (pre-rendered so the page ships no client-side markdown engine).
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",   # parallel live tests: pytest --run-live -n 8
  "ty>=0.0.49",          # static type checking: ty check harness
]

[project.scripts]
skill-harness = "harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["unit"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "live: hits the live model APIs (via litellm) and live CRDC APIs (opt-in via --run-live)",
]

[tool.ty.src]
include = ["harness"]

[tool.ty.environment]
python-version = "3.11"
